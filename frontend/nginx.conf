server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri /index.html;
    }

    # Proxy API calls to the backend service.
    # Using a variable with resolver prevents Nginx from failing startup if host is not yet resolvable.
    location /api/ {
        resolver 127.0.0.11 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
        set $backend "http://skillmatch-api:8080/api/";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
